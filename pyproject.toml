[project]
name = "spherex-workspace"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "numpy>=2,<3",
  "astropy>=7,<8",
  "astroquery>=0.4.10,<0.5",
  "reproject>=0.14,<1",
  "pillow>=11,<13",
  "sep>=1.4,<2",
  "scipy>=1.13,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
